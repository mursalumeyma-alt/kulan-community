<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kulan</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Kulan</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="contact">

    <div class="section-header">
        <h2>Contact Us</h2>
    </div>

    <div class="contact-container">

        <div class="contact-info">

            <h3>Get in Touch</h3>

            <p>📍 Minneapolis, Minnesota</p>

            <p>📞 +1 (612) 555-1234</p>

            <p>✉ hello@kulan.com</p>

            <p>
                We'd love to hear from you. Whether you're looking to
                join a community or organize an event, we're here to help.
            </p>

        </div>

        <form id="contactForm" class="contact-form">

            <input
                type="text"
                id="name"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                id="subject"
                placeholder="Subject"
                required
            >

            <textarea
                id="message"
                rows="6"
                placeholder="Your Message"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

<script src="js/contact.js"></script>

</body>
</html>
